name: Deadlock Matrix Test

on:
  workflow_dispatch:
  push:
    paths:
      - "作业2_Deadlock/**"
      - ".github/workflows/deadlock-matrix.yml"

jobs:
  deadlock-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deadlock test
        run: python 作业2_Deadlock/test_deadlock.py --runs 100 --timeout 3 --log deadlock-${{ matrix.os }}.log

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: deadlock-${{ matrix.os }}
          path: deadlock-${{ matrix.os }}.log
